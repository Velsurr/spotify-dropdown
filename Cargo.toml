[package]
name = "spotify-dropdown"
version = "0.2.1"
default-run = "spotify-dropdown"
edition = "2024"
rust-version = "1.88"
description = "Controle local e compacto do Spotify Desktop via sessoes de midia do Windows"
publish = false

[dependencies]
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "=0.25.8", default-features = false, features = ["png", "jpeg"] }
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "Win32_System_WinRT", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse"] }
windows-future = "=0.3.2"
raw-window-handle = "=0.6.2"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
